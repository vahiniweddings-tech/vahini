name = "vahini-weddings"
main = "src/worker.js"
compatibility_date = "2026-11-05"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]
not_found_handling = "404-page"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "vahini-media"

[[d1_databases]]
binding = "DB"
database_name = "vahini-db"
database_id = "REPLACE_WITH_THE_CLIENT_D1_DATABASE_ID"
